<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa do Laboratório de Ensaios - Sincronizado</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // ----------------------------------------------------
    // COLE AS SUAS CREDENCIAIS DO FIREBASE AQUI EMBAIXO:
    // ----------------------------------------------------
    // Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyCMMaBwf1CWZhuG62hgGjYx3Sl4TdbtrsI",
  authDomain: "mapa-laboratorio.firebaseapp.com",
  projectId: "mapa-laboratorio",
  storageBucket: "mapa-laboratorio.firebasestorage.app",
  messagingSenderId: "228896106234",
  appId: "1:228896106234:web:f93c4101aedecfbffa4b43"
};


    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.firebaseDB = { db, ref, onValue, set };
  </script>
  <style>
    body { user-select: none; overflow: hidden; background-color: #090d16; }
  </style>
</head>
<body class="bg-[#090d16] text-slate-100 h-screen w-screen overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const INITIAL_DATA = {
      // Esquerda: Linhas 1 a 5[cite: 4, 5, 6, 7]
      "L1-E": { id: "L1-E", label: "LINHA 1", project: "SE 230kV Blumenau", stage: "TAF", status: "NO PRAZO", panels: ["QCP-01", "QCP-02"] },
      "L2-E": { id: "L2-E", label: "LINHA 2", project: "SE Itajaí II", stage: "PRE-TAF", status: "ATRASADO", panels: ["PN-87T"] },
      "L3-E": { id: "L3-E", label: "LINHA 3", project: "", stage: "PRE-TAF", status: "NO PRAZO", panels: [] },
      "L4-E": { id: "L4-E", label: "LINHA 4", project: "PCH Rio Bonito", stage: "PRE-TAF", status: "NO PRAZO", panels: ["QTA-01"] },
      "L5-E": { id: "L5-E", label: "LINHA 5", project: "", stage: "PRE-TAF", status: "NO PRAZO", panels: [] },

      // Direita: Linhas 1 a 8[cite: 4, 5, 6, 7]
      "RD-1": { id: "RD-1", label: "LINHA 1", project: "SE Gaspar 138kV", stage: "PRE-TAF", status: "NO PRAZO", panels: ["PN-01"] },
      "RD-2": { id: "RD-2", label: "LINHA 2", project: "", stage: "PRE-TAF", status: "NO PRAZO", panels: [] },
      "RD-3": { id: "RD-3", label: "LINHA 3", project: "SE Joinville Norte", stage: "TAF", status: "ATRASADO", panels: ["QCP-87L1"] },
      "RD-4": { id: "RD-4", label: "LINHA 4", project: "", stage: "PRE-TAF", status: "NO PRAZO", panels: [] },
      "RD-5": { id: "RD-5", label: "LINHA 5", project: "", stage: "PRE-TAF", status: "NO PRAZO", panels: [] },
      "RD-6": { id: "RD-6", label: "LINHA 6", project: "UFV Sol do Sertão", stage: "TAF", status: "NO PRAZO", panels: ["SKID-01"] },
      "RD-7": { id: "RD-7", label: "LINHA 7", project: "", stage: "PRE-TAF", status: "NO PRAZO", panels: [] },
      "RD-8": { id: "RD-8", label: "LINHA 8", project: "", stage: "PRE-TAF", status: "NO PRAZO", panels: [] },

      // Canto Inferior Esquerdo: 6 Plataformas de Rotina otimizadas[cite: 4, 5, 6, 7]
      "ROT-1": { id: "ROT-1", label: "PLATAFORMA 1", project: "Lote CCM Industrial", stage: "ROTINA", status: "NO PRAZO", panels: ["CCM-01A"] },
      "ROT-2": { id: "ROT-2", label: "PLATAFORMA 2", project: "SE Tubarão", stage: "ROTINA", status: "NO PRAZO", panels: ["QDCA-01"] },
      "ROT-3": { id: "ROT-3", label: "PLATAFORMA 3", project: "", stage: "ROTINA", status: "NO PRAZO", panels: [] },
      "ROT-4": { id: "ROT-4", label: "PLATAFORMA 4", project: "", stage: "ROTINA", status: "NO PRAZO", panels: [] },
      "ROT-5": { id: "ROT-5", label: "PLATAFORMA 5", project: "", stage: "ROTINA", status: "NO PRAZO", panels: [] },
      "ROT-6": { id: "ROT-6", label: "PLATAFORMA 6", project: "", stage: "ROTINA", status: "NO PRAZO", panels: [] },
    };

    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [loginUser, setLoginUser] = useState("");
      const [loginPass, setLoginPass] = useState("");
      const [loginError, setLoginError] = useState(false);

      const [slots, setSlots] = useState(INITIAL_DATA);
      const [clock, setClock] = useState(new Date());
      const [editingId, setEditingId] = useState(null);
      const [formProject, setFormProject] = useState("");
      const [formStage, setFormStage] = useState("PRE-TAF");
      const [formStatus, setFormStatus] = useState("NO PRAZO");
      const [formPanels, setFormPanels] = useState("");
      const [isConnected, setIsConnected] = useState(false);

      useEffect(() => {
        const checkFirebase = setInterval(() => {
          if (window.firebaseDB) {
            clearInterval(checkFirebase);
            const { db, ref, onValue } = window.firebaseDB;
            const slotsRef = ref(db, 'laboratorio/slots_v9');

            onValue(slotsRef, (snapshot) => {
              const data = snapshot.val();
              if (data) {
                setSlots(data);
                setIsConnected(true);
              } else {
                window.firebaseDB.set(slotsRef, INITIAL_DATA);
              }
            });
          }
        }, 200);

        return () => clearInterval(checkFirebase);
      }, []);

      const updateSlotsInCloud = (newSlots) => {
        setSlots(newSlots);
        if (window.firebaseDB) {
          const { db, ref, set } = window.firebaseDB;
          set(ref(db, 'laboratorio/slots_v9'), newSlots);
        }
      };

      useEffect(() => {
        const timer = setInterval(() => setClock(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      const handleLogin = (e) => {
        e.preventDefault();
        if (loginUser === "Comissionamento" && loginPass === "Weg@1234") {
          setIsAuthenticated(true);
          setLoginError(false);
        } else {
          setLoginError(true);
        }
      };

      const openModal = (id) => {
        const item = slots[id] || INITIAL_DATA[id];
        setEditingId(id);
        setFormProject(item.project || "");
        setFormStage(item.stage || (id.startsWith("ROT") ? "ROTINA" : "PRE-TAF"));
        setFormStatus(item.status || "NO PRAZO");
        setFormPanels((item.panels || []).join(", "));
      };

      const saveSlot = (e) => {
        e.preventDefault();
        const panelsList = formPanels.split(",").map((s) => s.trim()).filter(Boolean);
        const updated = {
          ...slots,
          [editingId]: {
            ...slots[editingId],
            project: formProject.trim(),
            stage: formStage,
            status: formStatus,
            panels: panelsList,
          },
        };
        updateSlotsInCloud(updated);
        setEditingId(null);
      };

      const clearSlot = () => {
        const updated = {
          ...slots,
          [editingId]: {
            ...slots[editingId],
            project: "",
            panels: [],
          },
        };
        updateSlotsInCloud(updated);
        setEditingId(null);
      };

      const toggleStage = (e, id) => {
        e.stopPropagation();
        const curr = slots[id].stage;
        const next = curr === "TAF" ? "PRE-TAF" : "TAF";
        const updated = {
          ...slots,
          [id]: { ...slots[id], stage: next },
        };
        updateSlotsInCloud(updated);
      };

      const totalOccupied = Object.values(slots).filter((s) => s.project).length;
      const totalAvailable = Object.values(slots).length - totalOccupied;

      const PlatformLine = ({ id }) => {
        const data = slots[id] || INITIAL_DATA[id];
        const isOccupied = Boolean(data.project);
        const isTAF = data.stage === "TAF";
        const isDelayed = data.status === "ATRASADO";

        return (
          <div className="relative flex items-center h-full w-full py-0.5 px-1">
            <div className="absolute left-0 right-0 h-1.5 bg-slate-700 rounded-full z-0" />
            {isOccupied ? (
              <div
                onClick={() => openModal(id)}
                className={`relative z-10 w-full flex items-center justify-between px-2.5 py-1 rounded-lg border-2 cursor-pointer transition-all shadow-lg ${
                  isTAF ? "bg-emerald-950/95 border-emerald-500 hover:bg-emerald-900" : "bg-amber-950/95 border-amber-500 hover:bg-amber-900"
                }`}
              >
                <div className="flex items-center gap-2.5 min-w-0 pr-2">
                  <span className="text-[10px] font-extrabold px-1.5 py-0.5 rounded bg-black/50 text-slate-300 shrink-0">
                    {data.label}
                  </span>
                  <div className="truncate">
                    <div className="text-[11px] font-black text-white truncate">{data.project}</div>
                    <div className="flex flex-wrap gap-1 mt-0.5">
                      {data.panels.map((p, idx) => (
                        <span key={idx} className="text-[9px] font-mono font-bold px-1 py-0.2 rounded bg-black/60 text-slate-200 border border-white/15">
                          {p}
                        </span>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="flex flex-col items-end gap-0.5 shrink-0">
                  <span className={`text-[8px] font-black px-1.5 py-0.2 rounded tracking-wider uppercase ${
                    isDelayed ? "bg-rose-600 text-white animate-pulse" : "bg-sky-600/80 text-white"
                  }`}>
                    {data.status || "NO PRAZO"}
                  </span>
                  <button
                    onClick={(e) => toggleStage(e, id)}
                    className={`px-2 py-0.2 rounded text-[9px] font-black tracking-wider uppercase border transition ${
                      isTAF ? "bg-emerald-500 text-slate-950 border-emerald-300" : "bg-amber-400 text-slate-950 border-amber-200"
                    }`}
                  >
                    {isTAF ? "EM TAF" : "PRÉ-TAF"}
                  </button>
                </div>
              </div>
            ) : (
              <button
                onClick={() => openModal(id)}
                className="relative z-10 mx-auto px-3 py-0.5 rounded-full bg-slate-900/95 border border-dashed border-slate-600 hover:border-sky-400 text-slate-400 hover:text-sky-300 text-[10px] font-bold flex items-center gap-1.5 transition"
              >
                <span>{data.label}: DISPONÍVEL</span>
                <span className="text-sky-400 font-black">+ Adicionar</span>
              </button>
            )}
          </div>
        );
      };

      if (!isAuthenticated) {
        return (
          <div className="h-screen w-screen flex items-center justify-center bg-[#090d16] p-4">
            <form onSubmit={handleLogin} className="bg-slate-900 border-2 border-slate-700 rounded-2xl w-full max-w-sm p-8 shadow-2xl space-y-5">
              <div className="text-center space-y-1">
                <div className="w-12 h-12 bg-sky-500 rounded-xl mx-auto mb-3 flex items-center justify-center font-black text-slate-950 text-xl">
                  WEG
                </div>
                <h1 className="text-xl font-black text-white uppercase tracking-wider">Laboratório de Ensaios</h1>
                <p className="text-xs text-slate-400">Insira as credenciais de acesso</p>
              </div>

              {loginError && (
                <div className="p-3 rounded-lg bg-rose-950/80 border border-rose-600 text-rose-300 text-xs font-bold text-center">
                  Usuário ou senha inválidos.
                </div>
              )}

              <div className="space-y-4">
                <div>
                  <label className="block text-xs font-bold uppercase text-slate-300 mb-1">Usuário</label>
                  <input
                    type="text"
                    value={loginUser}
                    onChange={(e) => setLoginUser(e.target.value)}
                    placeholder=""
                    className="w-full px-3 py-2.5 rounded-lg bg-slate-950 border border-slate-700 text-white text-sm focus:border-sky-400 outline-none"
                    required
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold uppercase text-slate-300 mb-1">Senha</label>
                  <input
                    type="password"
                    value={loginPass}
                    onChange={(e) => setLoginPass(e.target.value)}
                    placeholder="••••••••"
                    className="w-full px-3 py-2.5 rounded-lg bg-slate-950 border border-slate-700 text-white text-sm focus:border-sky-400 outline-none"
                    required
                  />
                </div>

                <button
                  type="submit"
                  className="w-full py-3 rounded-lg bg-sky-500 hover:bg-sky-400 text-slate-950 text-sm font-black uppercase tracking-wider transition shadow-lg"
                >
                  Entrar no Sistema
                </button>
              </div>
            </form>
          </div>
        );
      }

      return (
        <div className="h-screen w-screen flex flex-col p-3 bg-[#090d16] select-none overflow-hidden">
          <header className="flex items-center justify-between px-5 py-2.5 mb-2 rounded-xl bg-slate-900/90 border border-slate-800 shrink-0">
            <div className="flex items-center gap-4">
              <div className="w-3 h-7 rounded bg-sky-500" />
              <div>
                <h1 className="text-lg font-black tracking-wide text-white uppercase">
                  Laboratório de Ensaios
                </h1>
                <p className="text-[11px] text-slate-400 flex items-center gap-2">
                  <span>Sincronizado em Nuvem</span>
                  <span className={`w-2 h-2 rounded-full ${isConnected ? "bg-emerald-400 animate-pulse" : "bg-amber-400"}`} />
                </p>
              </div>
            </div>

            <div className="flex items-center gap-5">
              <div className="flex items-center gap-3 text-xs font-bold">
                <span className="flex items-center gap-2 px-2.5 py-1 rounded-lg bg-emerald-950 border border-emerald-500 text-emerald-300">
                  <span className="w-2 h-2 rounded-full bg-emerald-400" /> EM TAF
                </span>
                <span className="flex items-center gap-2 px-2.5 py-1 rounded-lg bg-amber-950 border border-amber-500 text-amber-300">
                  <span className="w-2 h-2 rounded-full bg-amber-400" /> PRÉ-TAF
                </span>
                <span className="px-2.5 py-1 rounded-lg bg-slate-800 text-slate-300">
                  Livres: <strong className="text-white">{totalAvailable}</strong>
                </span>
              </div>

              <div className="text-right pl-4 border-l border-slate-800">
                <div className="text-xl font-mono font-black text-white leading-none">
                  {clock.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", second: "2-digit" })}
                </div>
                <div className="text-[10px] text-slate-400 uppercase mt-0.5">
                  {clock.toLocaleDateString("pt-BR", { weekday: "short", day: "2-digit", month: "short", year: "numeric" })}
                </div>
              </div>
            </div>
          </header>

          <div className="flex-1 relative pl-16 pb-1 min-h-0">
            <div className="w-full h-full relative border-4 border-slate-300 rounded-lg bg-[#0d1320] flex flex-col justify-between p-3.5">
              
              {/* 5 PORTAS NA PAREDE ESQUERDA[cite: 4, 5, 6, 7] */}
              {[
                { top: "2%", h: "h-8" },
                { top: "15%", h: "h-14" },
                { top: "36%", h: "h-14" },
                { top: "58%", h: "h-14" },
                { top: "82%", h: "h-14" },
              ].map((door, i) => (
                <div
                  key={i}
                  style={{ top: door.top }}
                  className={`absolute left-0 -translate-x-1/2 ${door.h} w-3.5 border-2 border-slate-200 bg-[#090d16] z-30 flex items-center justify-end`}
                >
                  <span className="absolute right-full mr-2.5 text-[10px] font-black tracking-wider text-slate-300 whitespace-nowrap">
                    PORTA
                  </span>
                </div>
              ))}

              {/* LAYOUT PRINCIPAL: ALINHAMENTO MILIMÉTRICO DAS LINHAS 1 A 5 E APROXIMAÇÃO DO CORREDOR[cite: 4, 5, 6, 7] */}
              <div className="grid grid-cols-12 gap-1.5 h-full min-h-0 items-center">
                
                {/* LADO ESQUERDO: 5 Linhas exatas sincronizadas com o lado direito + Rotina Otimizada[cite: 4, 5, 6, 7] */}
                <div className="col-span-5 h-full flex flex-col justify-between pr-0.5">
                  <div className="grid grid-rows-8 h-[62%] gap-0.5 items-center">
                    <PlatformLine id="L1-E" />
                    <PlatformLine id="L2-E" />
                    <PlatformLine id="L3-E" />
                    <PlatformLine id="L4-E" />
                    <PlatformLine id="L5-E" />
                    <div className="invisible" />
                    <div className="invisible" />
                    <div className="invisible" />
                  </div>

                  {/* Teste de Rotina com altura otimizada e 6 Plataformas[cite: 4, 5, 6, 7] */}
                  <div className="h-[35%] border-4 border-dashed border-yellow-500/80 rounded-lg bg-yellow-950/10 p-2 flex flex-col justify-between relative">
                    <div className="flex items-center justify-between shrink-0">
                      <span className="text-[10px] font-black tracking-widest uppercase px-2 py-0.5 rounded bg-yellow-500/20 text-yellow-300 border border-yellow-500/40">
                        Teste de Rotina
                      </span>
                    </div>

                    <div className="grid grid-cols-3 grid-rows-2 gap-1 my-auto">
                      {["ROT-1", "ROT-2", "ROT-3", "ROT-4", "ROT-5", "ROT-6"].map((rotId) => {
                        const r = slots[rotId] || INITIAL_DATA[rotId];
                        const occ = Boolean(r.project);
                        return (
                          <div
                            key={rotId}
                            onClick={() => openModal(rotId)}
                            className={`p-1 rounded-lg border-2 cursor-pointer transition flex flex-col justify-between min-h-[42px] ${
                              occ ? "bg-sky-950/90 border-sky-400 hover:bg-sky-900" : "bg-slate-900/70 border-dashed border-slate-700 hover:border-sky-400"
                            }`}
                          >
                            <div className="flex items-center justify-between">
                              <span className="text-[7px] font-extrabold text-slate-300 uppercase">{r.label}</span>
                              {occ && <span className="text-[7px] font-black px-1 rounded bg-sky-400 text-slate-950">ROT</span>}
                            </div>
                            {occ ? (
                              <div>
                                <div className="text-[9px] font-black text-white truncate">{r.project}</div>
                                <div className="flex flex-wrap gap-0.5">
                                  {r.panels.map((p, idx) => (
                                    <span key={idx} className="text-[7px] font-mono font-bold px-0.5 rounded bg-black/50 text-sky-200">
                                      {p}
                                    </span>
                                  ))}
                                </div>
                              </div>
                            ) : (
                              <div className="text-[8px] font-bold text-slate-400 text-center my-auto">+ Disponível</div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>

                {/* CORREDOR CENTRAL MAIS ESTREITO E PRÓXIMO[cite: 4, 5, 6, 7] */}
                <div className="col-span-2 h-[85%] flex items-center justify-center">
                  <div className="w-12 h-full border-2 border-slate-300 bg-slate-900/80 rounded flex items-center justify-center shadow-inner">
                    <span className="text-[11px] font-black tracking-[0.25em] text-slate-300 uppercase -rotate-90 whitespace-nowrap">
                      Corredor
                    </span>
                  </div>
                </div>

                {/* LADO DIREITO: 8 Linhas alinhadas[cite: 4, 5, 6, 7] */}
                <div className="col-span-5 h-full flex flex-col justify-between pl-0.5 py-1">
                  <div className="grid grid-rows-8 h-full gap-0.5 items-center">
                    <PlatformLine id="RD-1" />
                    <PlatformLine id="RD-2" />
                    <PlatformLine id="RD-3" />
                    <PlatformLine id="RD-4" />
                    <PlatformLine id="RD-5" />
                    <PlatformLine id="RD-6" />
                    <PlatformLine id="RD-7" />
                    <PlatformLine id="RD-8" />
                  </div>
                </div>

              </div>

            </div>
          </div>

          {editingId && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
              <form onSubmit={saveSlot} className="bg-slate-900 border-2 border-slate-700 rounded-xl w-full max-w-md p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h2 className="text-lg font-black text-white">Editar {(slots[editingId] || INITIAL_DATA[editingId]).label}</h2>
                  <button type="button" onClick={() => setEditingId(null)} className="text-slate-400 hover:text-white font-bold text-sm">FECHAR ✕</button>
                </div>

                <div>
                  <label className="block text-xs font-bold uppercase text-slate-300 mb-1">Nome do Projeto / Cliente</label>
                  <input
                    type="text"
                    value={formProject}
                    onChange={(e) => setFormProject(e.target.value)}
                    placeholder="Ex: SE 230kV Blumenau"
                    className="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-700 text-white text-sm focus:border-sky-400 outline-none"
                    autoFocus
                  />
                </div>

                {!editingId.startsWith("ROT") && (
                  <div>
                    <label className="block text-xs font-bold uppercase text-slate-300 mb-1">Fase do Ensaio</label>
                    <div className="grid grid-cols-2 gap-3">
                      <button
                        type="button"
                        onClick={() => setFormStage("PRE-TAF")}
                        className={`py-2 rounded-lg font-black text-xs border-2 transition ${formStage === "PRE-TAF" ? "bg-amber-400 text-slate-950 border-amber-200" : "bg-slate-950 text-slate-400 border-slate-800"}`}
                      >
                        PRÉ-TAF
                      </button>
                      <button
                        type="button"
                        onClick={() => setFormStage("TAF")}
                        className={`py-2 rounded-lg font-black text-xs border-2 transition ${formStage === "TAF" ? "bg-emerald-500 text-slate-950 border-emerald-300" : "bg-slate-950 text-slate-400 border-slate-800"}`}
                      >
                        EM TAF
                      </button>
                    </div>
                  </div>
                )}

                <div>
                  <label className="block text-xs font-bold uppercase text-slate-300 mb-1">Status do Prazo</label>
                  <div className="grid grid-cols-2 gap-3">
                    <button
                      type="button"
                      onClick={() => setFormStatus("NO PRAZO")}
                      className={`py-2 rounded-lg font-black text-xs border-2 transition ${formStatus === "NO PRAZO" ? "bg-sky-500 text-slate-950 border-sky-300" : "bg-slate-950 text-slate-400 border-slate-800"}`}
                    >
                      NO PRAZO
                    </button>
                    <button
                      type="button"
                      onClick={() => setFormStatus("ATRASADO")}
                      className={`py-2 rounded-lg font-black text-xs border-2 transition ${formStatus === "ATRASADO" ? "bg-rose-600 text-white border-rose-400" : "bg-slate-950 text-slate-400 border-slate-800"}`}
                    >
                      ATRASADO
                    </button>
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-bold uppercase text-slate-300 mb-1">Códigos dos Painéis (separados por vírgula)</label>
                  <input
                    type="text"
                    value={formPanels}
                    onChange={(e) => setFormPanels(e.target.value)}
                    placeholder="Ex: QCP-01, QCP-02, PN-87L"
                    className="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-700 text-white text-sm font-mono focus:border-sky-400 outline-none"
                  />
                </div>

                <div className="flex items-center justify-between pt-3 border-t border-slate-800">
                  <button type="button" onClick={clearSlot} className="px-4 py-2 rounded-lg bg-rose-950 hover:bg-rose-900 text-rose-300 border border-rose-700 text-xs font-bold">Liberar Linha</button>
                  <div className="flex gap-2">
                    <button type="button" onClick={() => setEditingId(null)} className="px-4 py-2 rounded-lg bg-slate-800 text-slate-300 text-xs font-bold">Cancelar</button>
                    <button type="submit" className="px-5 py-2 rounded-lg bg-sky-500 hover:bg-sky-400 text-slate-950 text-xs font-black">Salvar</button>
                  </div>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
