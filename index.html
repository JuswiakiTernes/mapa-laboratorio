<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa do Laboratório de Ensaios - Sincronizado</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // ----------------------------------------------------
    // COLE AS SUAS CREDENCIAIS DO FIREBASE AQUI EMBAIXO:
    // ----------------------------------------------------
    // Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyCMMaBwf1CWZhuG62hgGjYx3Sl4TdbtrsI",
  authDomain: "mapa-laboratorio.firebaseapp.com",
  projectId: "mapa-laboratorio",
  storageBucket: "mapa-laboratorio.firebasestorage.app",
  messagingSenderId: "228896106234",
  appId: "1:228896106234:web:f93c4101aedecfbffa4b43"
};


    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.firebaseDB = { db, ref, onValue, set };
  </script>
  <style>
    body { user-select: none; overflow: hidden; background-color: #090d16; }
  </style>
</head>
<body class="bg-[#090d16] text-slate-100 h-screen w-screen overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const INITIAL_DATA = {
      "L1-E": { id: "L1-E", label: "LINHA 1", project: "SE 230kV Blumenau", stage: "TAF", panels: ["QCP-01", "QCP-02", "QCP-03"] },
      "L2-E": { id: "L2-E", label: "LINHA 2", project: "SE Itajaí II", stage: "PRE-TAF", panels: ["PN-87T", "PN-50/51"] },
      "L3-E": { id: "L3-E", label: "LINHA 3", project: "", stage: "PRE-TAF", panels: [] },
      "L4-E": { id: "L4-E", label: "LINHA 4 (ESQ)", project: "SE Joinville Norte", stage: "TAF", panels: ["QCP-87L1", "QCP-87L2", "QCP-21L1"] },
      "L5-E": { id: "L5-E", label: "LINHA 5 (ESQ)", project: "", stage: "PRE-TAF", panels: [] },
      "L6-E": { id: "L6-E", label: "LINHA 6 (ESQ)", project: "PCH Rio Bonito", stage: "PRE-TAF", panels: ["QTA-01", "QCSA-01"] },
      "L7-E": { id: "L7-E", label: "LINHA 7 (ESQ)", project: "", stage: "PRE-TAF", panels: [] },
      "L8-E": { id: "L8-E", label: "LINHA 8 (ESQ)", project: "", stage: "PRE-TAF", panels: [] },
      "L4-D": { id: "L4-D", label: "LINHA 4 (DIR)", project: "SE Gaspar 138kV", stage: "PRE-TAF", panels: ["PN-01", "PN-02"] },
      "L5-D": { id: "L5-D", label: "LINHA 5 (DIR)", project: "", stage: "PRE-TAF", panels: [] },
      "L6-D": { id: "L6-D", label: "LINHA 6 (DIR)", project: "UFV Sol do Sertão", stage: "TAF", panels: ["SKID-01", "SKID-02"] },
      "L7-D": { id: "L7-D", label: "LINHA 7 (DIR)", project: "", stage: "PRE-TAF", panels: [] },
      "L8-D": { id: "L8-D", label: "LINHA 8 (DIR)", project: "", stage: "PRE-TAF", panels: [] },
      "ROT-1": { id: "ROT-1", label: "BANCADA ROTINA 1", project: "Lote CCM Industrial", stage: "ROTINA", panels: ["CCM-01A", "CCM-01B"] },
      "ROT-2": { id: "ROT-2", label: "BANCADA ROTINA 2", project: "SE Tubarão", stage: "ROTINA", panels: ["QDCA-01", "QDCC-01"] },
      "ROT-3": { id: "ROT-3", label: "BANCADA ROTINA 3", project: "", stage: "ROTINA", panels: [] },
    };

    function App() {
      const [slots, setSlots] = useState(INITIAL_DATA);
      const [clock, setClock] = useState(new Date());
      const [editingId, setEditingId] = useState(null);
      const [formProject, setFormProject] = useState("");
      const [formStage, setFormStage] = useState("PRE-TAF");
      const [formPanels, setFormPanels] = useState("");
      const [isConnected, setIsConnected] = useState(false);

      // Sincronização em tempo real com o Firebase
      useEffect(() => {
        const checkFirebase = setInterval(() => {
          if (window.firebaseDB) {
            clearInterval(checkFirebase);
            const { db, ref, onValue } = window.firebaseDB;
            const slotsRef = ref(db, 'laboratorio/slots');

            onValue(slotsRef, (snapshot) => {
              const data = snapshot.val();
              if (data) {
                setSlots(data);
                setIsConnected(true);
              } else {
                // Se o banco estiver vazio, grava os dados iniciais
                window.firebaseDB.set(slotsRef, INITIAL_DATA);
              }
            });
          }
        }, 200);

        return () => clearInterval(checkFirebase);
      }, []);

      const updateSlotsInCloud = (newSlots) => {
        setSlots(newSlots);
        if (window.firebaseDB) {
          const { db, ref, set } = window.firebaseDB;
          set(ref(db, 'laboratorio/slots'), newSlots);
        }
      };

      useEffect(() => {
        const timer = setInterval(() => setClock(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      const openModal = (id) => {
        const item = slots[id] || INITIAL_DATA[id];
        setEditingId(id);
        setFormProject(item.project || "");
        setFormStage(item.stage || (id.startsWith("ROT") ? "ROTINA" : "PRE-TAF"));
        setFormPanels((item.panels || []).join(", "));
      };

      const saveSlot = (e) => {
        e.preventDefault();
        const panelsList = formPanels.split(",").map((s) => s.trim()).filter(Boolean);
        const updated = {
          ...slots,
          [editingId]: {
            ...slots[editingId],
            project: formProject.trim(),
            stage: formStage,
            panels: panelsList,
          },
        };
        updateSlotsInCloud(updated);
        setEditingId(null);
      };

      const clearSlot = () => {
        const updated = {
          ...slots,
          [editingId]: {
            ...slots[editingId],
            project: "",
            panels: [],
          },
        };
        updateSlotsInCloud(updated);
        setEditingId(null);
      };

      const toggleStage = (e, id) => {
        e.stopPropagation();
        const curr = slots[id].stage;
        const next = curr === "TAF" ? "PRE-TAF" : "TAF";
        const updated = {
          ...slots,
          [id]: { ...slots[id], stage: next },
        };
        updateSlotsInCloud(updated);
      };

      const totalOccupied = Object.values(slots).filter((s) => s.project).length;
      const totalAvailable = Object.values(slots).length - totalOccupied;

      const PlatformLine = ({ id }) => {
        const data = slots[id] || INITIAL_DATA[id];
        const isOccupied = Boolean(data.project);
        const isTAF = data.stage === "TAF";

        return (
          <div className="relative flex items-center h-full w-full py-1.5">
            <div className="absolute left-0 right-0 h-2 bg-slate-700 rounded-full z-0" />
            {isOccupied ? (
              <div
                onClick={() => openModal(id)}
                className={`relative z-10 w-full flex items-center justify-between px-3 py-2 rounded-lg border-2 cursor-pointer transition-all shadow-lg ${
                  isTAF ? "bg-emerald-950/95 border-emerald-500 hover:bg-emerald-900" : "bg-amber-950/95 border-amber-500 hover:bg-amber-900"
                }`}
              >
                <div className="flex items-center gap-3 min-w-0 pr-2">
                  <span className="text-xs font-extrabold px-2 py-0.5 rounded bg-black/50 text-slate-300 shrink-0">
                    {data.label}
                  </span>
                  <div className="truncate">
                    <div className="text-sm font-black text-white truncate">{data.project}</div>
                    <div className="flex flex-wrap gap-1 mt-0.5">
                      {data.panels.map((p, idx) => (
                        <span key={idx} className="text-[11px] font-mono font-bold px-1.5 py-0.2 rounded bg-black/60 text-slate-200 border border-white/15">
                          {p}
                        </span>
                      ))}
                    </div>
                  </div>
                </div>
                <button
                  onClick={(e) => toggleStage(e, id)}
                  className={`shrink-0 px-2.5 py-1 rounded text-xs font-black tracking-wider uppercase border transition ${
                    isTAF ? "bg-emerald-500 text-slate-950 border-emerald-300" : "bg-amber-400 text-slate-950 border-amber-200"
                  }`}
                >
                  {isTAF ? "EM TAF" : "PRÉ-TAF"}
                </button>
              </div>
            ) : (
              <button
                onClick={() => openModal(id)}
                className="relative z-10 mx-auto px-4 py-1 rounded-full bg-slate-900/95 border border-dashed border-slate-600 hover:border-sky-400 text-slate-400 hover:text-sky-300 text-xs font-bold flex items-center gap-2 transition"
              >
                <span>{data.label}: DISPONÍVEL</span>
                <span className="text-sky-400 font-black">+ Adicionar</span>
              </button>
            )}
          </div>
        );
      };

      return (
        <div className="h-screen w-screen flex flex-col p-4 bg-[#090d16] select-none">
          <header className="flex items-center justify-between px-5 py-3 mb-3 rounded-xl bg-slate-900/90 border border-slate-800">
            <div className="flex items-center gap-4">
              <div className="w-3 h-8 rounded bg-sky-500" />
              <div>
                <h1 className="text-xl font-black tracking-wide text-white uppercase">
                  Laboratório de Ensaios — Gestão à Vista
                </h1>
                <p className="text-xs text-slate-400 flex items-center gap-2">
                  <span>Sincronizado em Nuvem</span>
                  <span className={`w-2 h-2 rounded-full ${isConnected ? "bg-emerald-400 animate-pulse" : "bg-amber-400"}`} />
                </p>
              </div>
            </div>

            <div className="flex items-center gap-6">
              <div className="flex items-center gap-4 text-xs font-bold">
                <span className="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-emerald-950 border border-emerald-500 text-emerald-300">
                  <span className="w-2.5 h-2.5 rounded-full bg-emerald-400" /> EM TAF
                </span>
                <span className="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-amber-950 border border-amber-500 text-amber-300">
                  <span className="w-2.5 h-2.5 rounded-full bg-amber-400" /> PRÉ-TAF
                </span>
                <span className="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300">
                  Livres: <strong className="text-white">{totalAvailable}</strong>
                </span>
              </div>

              <div className="text-right pl-4 border-l border-slate-800">
                <div className="text-2xl font-mono font-black text-white leading-none">
                  {clock.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", second: "2-digit" })}
                </div>
                <div className="text-xs text-slate-400 uppercase mt-0.5">
                  {clock.toLocaleDateString("pt-BR", { weekday: "short", day: "2-digit", month: "short", year: "numeric" })}
                </div>
              </div>
            </div>
          </header>

          <div className="flex-1 relative pr-20 pb-2 min-h-0">
            <div className="w-full h-full relative border-4 border-slate-300 rounded-lg bg-[#0d1320] flex flex-col justify-between p-5">
              
              {[
                { top: "8%", h: "h-16" },
                { top: "36%", h: "h-16" },
                { top: "56%", h: "h-16" },
                { top: "75%", h: "h-16" },
                { top: "92%", h: "h-8" },
              ].map((door, i) => (
                <div
                  key={i}
                  style={{ top: door.top }}
                  className={`absolute right-0 translate-x-1/2 ${door.h} w-4 border-2 border-slate-200 bg-[#090d16] z-30 flex items-center`}
                >
                  <span className="absolute left-full ml-3 text-xs font-black tracking-wider text-slate-300 whitespace-nowrap">
                    PORTA
                  </span>
                </div>
              ))}

              <div className="grid grid-cols-12 gap-6 h-[37%] min-h-0">
                <div className="col-span-6 flex flex-col justify-between h-full pr-2">
                  <PlatformLine id="L1-E" />
                  <PlatformLine id="L2-E" />
                  <div className="text-center text-xs font-black tracking-[0.25em] text-slate-400 uppercase">
                    Comissionamento
                  </div>
                  <PlatformLine id="L3-E" />
                </div>

                <div className="col-span-6 h-full border-4 border-dashed border-yellow-500/80 rounded-lg bg-yellow-950/10 p-3 pr-6 flex flex-col justify-between relative">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-black tracking-widest uppercase px-2.5 py-0.5 rounded bg-yellow-500/20 text-yellow-300 border border-yellow-500/40">
                      Área Isolada por Cerca — Teste de Rotina
                    </span>
                  </div>

                  <div className="grid grid-cols-3 gap-2.5 my-auto">
                    {["ROT-1", "ROT-2", "ROT-3"].map((rotId) => {
                      const r = slots[rotId] || INITIAL_DATA[rotId];
                      const occ = Boolean(r.project);
                      return (
                        <div
                          key={rotId}
                          onClick={() => openModal(rotId)}
                          className={`p-2.5 rounded-lg border-2 cursor-pointer transition flex flex-col justify-between min-h-[92px] ${
                            occ ? "bg-sky-950/90 border-sky-400 hover:bg-sky-900" : "bg-slate-900/70 border-dashed border-slate-700 hover:border-sky-400"
                          }`}
                        >
                          <div className="flex items-center justify-between">
                            <span className="text-[10px] font-extrabold text-slate-300 uppercase">{r.label}</span>
                            {occ && <span className="text-[10px] font-black px-1.5 py-0.2 rounded bg-sky-400 text-slate-950">ROTINA</span>}
                          </div>
                          {occ ? (
                            <div>
                              <div className="text-xs font-black text-white truncate mt-1">{r.project}</div>
                              <div className="flex flex-wrap gap-1 mt-1">
                                {r.panels.map((p, idx) => (
                                  <span key={idx} className="text-[10px] font-mono font-bold px-1 rounded bg-black/50 text-sky-200">
                                    {p}
                                  </span>
                                ))}
                              </div>
                            </div>
                          ) : (
                            <div className="text-xs font-bold text-slate-400 text-center my-auto">+ Disponível</div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>

              <div className="grid grid-cols-12 gap-4 h-[60%] min-h-0 pt-2">
                <div className="col-span-5 flex flex-col justify-between h-full">
                  <PlatformLine id="L4-E" />
                  <PlatformLine id="L5-E" />
                  <div className="text-center text-xs font-black tracking-[0.25em] text-slate-400 uppercase">
                    Comissionamento
                  </div>
                  <PlatformLine id="L6-E" />
                  <PlatformLine id="L7-E" />
                  <PlatformLine id="L8-E" />
                </div>

                <div className="col-span-2 h-full flex items-center justify-center px-3">
                  <div className="w-full h-full border-4 border-slate-300 bg-slate-900/80 rounded flex items-center justify-center">
                    <span className="text-base font-black tracking-[0.35em] text-slate-200 uppercase -rotate-90 whitespace-nowrap">
                      Corredor
                    </span>
                  </div>
                </div>

                <div className="col-span-5 flex flex-col justify-between h-full pr-5">
                  <PlatformLine id="L4-D" />
                  <PlatformLine id="L5-D" />
                  <div className="text-center text-xs font-black tracking-[0.25em] text-slate-400 uppercase">
                    Comissionamento
                  </div>
                  <PlatformLine id="L6-D" />
                  <PlatformLine id="L7-D" />
                  <PlatformLine id="L8-D" />
                </div>
              </div>

            </div>
          </div>

          {editingId && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
              <form onSubmit={saveSlot} className="bg-slate-900 border-2 border-slate-700 rounded-xl w-full max-w-md p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h2 className="text-lg font-black text-white">Editar {(slots[editingId] || INITIAL_DATA[editingId]).label}</h2>
                  <button type="button" onClick={() => setEditingId(null)} className="text-slate-400 hover:text-white font-bold text-sm">FECHAR ✕</button>
                </div>

                <div>
                  <label className="block text-xs font-bold uppercase text-slate-300 mb-1">Nome do Projeto / Cliente</label>
                  <input
                    type="text"
                    value={formProject}
                    onChange={(e) => setFormProject(e.target.value)}
                    placeholder="Ex: SE 230kV Blumenau"
                    className="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-700 text-white text-sm focus:border-sky-400 outline-none"
                    autoFocus
                  />
                </div>

                {!editingId.startsWith("ROT") && (
                  <div>
                    <label className="block text-xs font-bold uppercase text-slate-300 mb-1">Fase do Ensaio</label>
                    <div className="grid grid-cols-2 gap-3">
                      <button
                        type="button"
                        onClick={() => setFormStage("PRE-TAF")}
                        className={`py-2 rounded-lg font-black text-xs border-2 transition ${formStage === "PRE-TAF" ? "bg-amber-400 text-slate-950 border-amber-200" : "bg-slate-950 text-slate-400 border-slate-800"}`}
                      >
                        PRÉ-TAF
                      </button>
                      <button
                        type="button"
                        onClick={() => setFormStage("TAF")}
                        className={`py-2 rounded-lg font-black text-xs border-2 transition ${formStage === "TAF" ? "bg-emerald-500 text-slate-950 border-emerald-300" : "bg-slate-950 text-slate-400 border-slate-800"}`}
                      >
                        EM TAF
                      </button>
                    </div>
                  </div>
                )}

                <div>
                  <label className="block text-xs font-bold uppercase text-slate-300 mb-1">Códigos dos Painéis (separados por vírgula)</label>
                  <input
                    type="text"
                    value={formPanels}
                    onChange={(e) => setFormPanels(e.target.value)}
                    placeholder="Ex: QCP-01, QCP-02, PN-87L"
                    className="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-700 text-white text-sm font-mono focus:border-sky-400 outline-none"
                  />
                </div>

                <div className="flex items-center justify-between pt-3 border-t border-slate-800">
                  <button type="button" onClick={clearSlot} className="px-4 py-2 rounded-lg bg-rose-950 hover:bg-rose-900 text-rose-300 border border-rose-700 text-xs font-bold">Liberar Linha</button>
                  <div className="flex gap-2">
                    <button type="button" onClick={() => setEditingId(null)} className="px-4 py-2 rounded-lg bg-slate-800 text-slate-300 text-xs font-bold">Cancelar</button>
                    <button type="submit" className="px-5 py-2 rounded-lg bg-sky-500 hover:bg-sky-400 text-slate-950 text-xs font-black">Salvar</button>
                  </div>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
